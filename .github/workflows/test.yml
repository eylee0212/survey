name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 의존성이 없어 설치 단계가 없다. Playwright가 없으므로 브라우저 시험은 건너뛴다.
      - run: npm test
